<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{file_name}} | KK_BOTS</title>
    
    <link rel="shortcut icon" href="https://graph.org/file/ab71e4363ebc7a7c992b1.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS & Tailwind -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --plyr-color-main: #ec4899;
            --plyr-video-control-color: #ffffff;
            --plyr-video-control-background-hover: rgba(236, 72, 153, 0.4);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030712;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .player-wrapper {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }
        .gesture-surface {
            position: absolute;
            inset: 0 0 54px 0;
            z-index: 25;
            display: flex;
            touch-action: manipulation;
            cursor: pointer;
        }
        .gesture-side {
            flex: 1;
            height: 100%;
            position: relative;
        }
        .seek-pill {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 9999px;
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 40;
        }
        .seek-pill.active {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
        #leftPill { left: 16%; }
        #rightPill { right: 16%; }
        
        .speed-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(168, 85, 247, 0.9));
            color: #fff;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5);
            z-index: 40;
        }
        .speed-badge.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-40 glass-panel border-b border-gray-800/80">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://graph.org/file/ab71e4363ebc7a7c992b1.jpg" alt="Logo" class="w-10 h-10 rounded-xl object-cover ring-2 ring-pink-500/30">
                <div class="flex flex-col">
                    <span class="font-black text-lg bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-rose-400 to-amber-400 leading-tight">KK_BOTS</span>
                    <span class="text-[10px] uppercase tracking-widest text-gray-400 font-semibold">STREAM HUB</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="https://t.me/KK_BOTS" target="_blank" class="px-3 py-1.5 rounded-lg bg-pink-500/10 hover:bg-pink-500/20 text-pink-400 border border-pink-500/20 text-xs font-semibold flex items-center gap-1.5 transition">
                    <i class="bi bi-telegram"></i>
                    <span>Channel</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto w-full px-4 py-4 sm:py-6 flex-1 flex flex-col gap-5">
        
        <!-- Video Header Info -->
        <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                    <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wider bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Direct Stream
                    </span>
                    <span class="text-xs text-gray-400 font-mono">MP4 / MKV</span>
                </div>
                <h1 id="movieTitle" class="text-base sm:text-lg font-bold text-gray-100 truncate">
                    {{file_name}}
                </h1>
            </div>

            <div class="flex items-center gap-2 flex-shrink-0">
                <button onclick="copyCurrentLink()" class="px-3 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 border border-gray-700 flex items-center gap-1.5 transition active:scale-95">
                    <i class="bi bi-link-45deg text-sm"></i>
                    <span>Copy Link</span>
                </button>
                <a id="downloadBtn" href="{{file_url}}" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:opacity-90 text-xs font-bold text-white shadow-lg shadow-pink-500/25 flex items-center gap-1.5 transition active:scale-95">
                    <i class="bi bi-cloud-arrow-down-fill text-sm"></i>
                    <span>Download</span>
                </a>
            </div>
        </div>

        <!-- Player Screen & Custom Gestures -->
        <div class="player-wrapper shadow-2xl ring-1 ring-white/10">
            <!-- 2X Speed Indicator -->
            <div id="speedBadge" class="speed-badge">
                <i class="bi bi-lightning-charge-fill mr-1"></i> 2X Speed
            </div>

            <!-- Double Tap Seek Indicators -->
            <div id="leftPill" class="seek-pill">
                <i class="bi bi-arrow-counterclockwise text-pink-400"></i> -10s
            </div>
            <div id="rightPill" class="seek-pill">
                +10s <i class="bi bi-arrow-clockwise text-pink-400"></i>
            </div>

            <!-- Video Player (Loads purely from bot backend) -->
            <video id="player" playsinline controls preload="metadata" class="w-full h-full">
                <source src="{{file_url}}" type="video/mp4">
            </video>

            <!-- Gesture Surface Layer -->
            <div id="gestureLayer" class="gesture-surface">
                <div class="gesture-side" id="leftSide"></div>
                <div class="gesture-side" id="rightSide"></div>
            </div>
        </div>

        <!-- External Players Section -->
        <div>
            <div class="flex items-center justify-between mb-3 px-1">
                <div>
                    <h2 class="text-sm font-bold text-gray-200 flex items-center gap-1.5">
                        <i class="bi bi-play-circle-fill text-pink-500"></i>
                        Open in External Player
                    </h2>
                    <p class="text-[11px] text-gray-400">Best for MKV/AC3 files without browser codec errors.</p>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5">
                <!-- VLC -->
                <button onclick="launchPlayer('vlc')" class="glass-panel p-3 rounded-xl hover:border-amber-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-cone-striped"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">VLC Player</span>
                    <span class="text-[9px] text-gray-400">Universal Codecs</span>
                </button>

                <!-- MX Player -->
                <button onclick="launchPlayer('mx')" class="glass-panel p-3 rounded-xl hover:border-blue-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-play-btn-fill"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">MX Player</span>
                    <span class="text-[9px] text-gray-400">HW+ Decoding</span>
                </button>

                <!-- PlayIt -->
                <button onclick="launchPlayer('playit')" class="glass-panel p-3 rounded-xl hover:border-cyan-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-phone-flip"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">PlayIt</span>
                    <span class="text-[9px] text-gray-400">Fast Stream</span>
                </button>

                <!-- KM Player -->
                <button onclick="launchPlayer('km')" class="glass-panel p-3 rounded-xl hover:border-purple-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-display"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">KM Player</span>
                    <span class="text-[9px] text-gray-400">HD / 4K</span>
                </button>

                <!-- S Player -->
                <button onclick="launchPlayer('splayer')" class="glass-panel p-3 rounded-xl hover:border-emerald-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-lightning-fill"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">S Player</span>
                    <span class="text-[9px] text-gray-400">Ultra Light</span>
                </button>

                <!-- Generic Intent -->
                <button onclick="launchPlayer('generic')" class="glass-panel p-3 rounded-xl hover:border-rose-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-box-arrow-up-right"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">Other App</span>
                    <span class="text-[9px] text-gray-400">Choose App</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="glass-panel border-t border-gray-800/80 mt-6 py-4 text-center text-xs text-gray-500">
        <p>© KK_BOTS - Stream Hub</p>
    </footer>

    <!-- Hidden Raw Source For JS (Safe Jinja2 extraction) -->
    <input type="hidden" id="raw_stream_url" value="{{file_url}}">

    <!-- Scripts -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // 1. Safe extraction of the link directly from HTML value
        const rawInput = document.getElementById('raw_stream_url');
        let streamUrl = rawInput ? rawInput.value.trim() : "";
        
        if (!streamUrl || streamUrl.includes("{{")) {
            streamUrl = window.location.href.replace("/watch/", "/");
        }

        // 2. Setup Plyr
        let player;
        document.addEventListener('DOMContentLoaded', () => {
            player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time',
                    'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                keyboard: { focused: true, global: true },
                tooltips: { controls: true, seek: true }
            });

            setupGestures();
        });

        // 3. YouTube Gestures (Press-Hold for 2x & Double tap to seek)
        function setupGestures() {
            const gestureLayer = document.getElementById('gestureLayer');
            const leftSide = document.getElementById('leftSide');
            const rightSide = document.getElementById('rightSide');
            const speedBadge = document.getElementById('speedBadge');
            const leftPill = document.getElementById('leftPill');
            const rightPill = document.getElementById('rightPill');

            let holdTimer = null;
            let isHolding2X = false;
            let lastTapTime = 0;
            let tapTimeout = null;

            function start2X() {
                if (!player) return;
                isHolding2X = true;
                player.speed = 2.0;
                speedBadge.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(40);
            }

            function stop2X() {
                if (holdTimer) clearTimeout(holdTimer);
                if (isHolding2X && player) {
                    player.speed = 1.0;
                    speedBadge.classList.remove('active');
                    isHolding2X = false;
                }
            }

            gestureLayer.addEventListener('pointerdown', (e) => {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                holdTimer = setTimeout(start2X, 400);
            });

            window.addEventListener('pointerup', stop2X);
            window.addEventListener('pointercancel', stop2X);

            function handleTap(isRightSide) {
                const now = Date.now();
                const diff = now - lastTapTime;
                lastTapTime = now;

                if (diff < 300) {
                    clearTimeout(tapTimeout);
                    if (isRightSide) {
                        player.currentTime = Math.min(player.duration || 999999, player.currentTime + 10);
                        flashIndicator(rightPill);
                    } else {
                        player.currentTime = Math.max(0, player.currentTime - 10);
                        flashIndicator(leftPill);
                    }
                } else {
                    tapTimeout = setTimeout(() => {
                        if (!isHolding2X && player) {
                            player.togglePlay();
                        }
                    }, 300);
                }
            }

            function flashIndicator(pill) {
                pill.classList.add('active');
                setTimeout(() => pill.classList.remove('active'), 600);
            }

            leftSide.addEventListener('click', () => {
                if (isHolding2X) return;
                handleTap(false);
            });

            rightSide.addEventListener('click', () => {
                if (isHolding2X) return;
                handleTap(true);
            });
        }

        // 4. External Player Launchers
        function launchPlayer(type) {
            const cleanUrl = streamUrl;
            let launchUri = '';

            switch(type) {
                case 'vlc':
                    launchUri = `vlc://${cleanUrl}`;
                    break;
                case 'mx':
                    launchUri = `intent:${cleanUrl}#Intent;type=video/*;package=com.mxtech.videoplayer.ad;S.title=${encodeURIComponent(document.title)};end`;
                    break;
                case 'playit':
                    launchUri = `playit://playerv2/video?url=${encodeURIComponent(cleanUrl)}`;
                    break;
                case 'km':
                    launchUri = `intent:${cleanUrl}#Intent;type=video/*;package=com.kmplayer;end`;
                    break;
                case 'splayer':
                    launchUri = `intent:${cleanUrl}#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;type=video/*;end`;
                    break;
                case 'generic':
                    launchUri = `intent:${cleanUrl}#Intent;action=android.intent.action.VIEW;type=video/*;end`;
                    break;
            }

            window.location.href = launchUri;
        }

        // 5. Copy Link
        function copyCurrentLink() {
            navigator.clipboard.writeText(streamUrl).then(() => {
                alert('Stream link copied to clipboard!');
            }).catch(() => {
                prompt("Copy Link:", streamUrl);
            });
        }
    </script>
</body>
</html>
