    {% raw %}
    <style>
        :root {
            --plyr-color-main: #ec4899;
            --plyr-video-control-color: #ffffff;
            --plyr-video-control-background-hover: rgba(236, 72, 153, 0.4);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030712;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .player-wrapper {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            background: #000;
        }

        /* Gestures inside Plyr */
        .plyr .gesture-surface {
            position: absolute;
            inset: 0 0 65px 0;
            z-index: 30;
            display: flex;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }
        .plyr .gesture-side {
            flex: 1;
            height: 100%;
            position: relative;
        }
        .plyr .seek-pill {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 22px;
            border-radius: 9999px;
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            z-index: 60;
        }
        .plyr .seek-pill.active {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
        .plyr #leftPill { left: 12%; }
        .plyr #rightPill { right: 12%; }
        
        .plyr .speed-badge {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.95), rgba(168, 85, 247, 0.95));
            color: #fff;
            padding: 8px 20px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            box-shadow: 0 4px 25px rgba(236, 72, 153, 0.6);
            z-index: 60;
        }
        .plyr .speed-badge.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
    {% endraw %}
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

    <!-- Main Content -->

        <!-- Video Player Wrapper -->

        <!-- External Players Section -->

                <!-- PlayIt -->
                <button onclick="playit_player()" class="glass-panel p-3 rounded-xl hover:border-cyan-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center text-xl group-hover:scale-110 transition">

                    </div>

                </button>

                <!-- KM Player -->
                <button onclick="km_player()" class="glass-panel p-3 rounded-xl hover:border-purple-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-display"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200">KM Player</span>

                </button>

                <!-- S Player -->
                <button onclick="s_player()" class="glass-panel p-3 rounded-xl hover:border-emerald-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-lightning-fill"></i>

                <!-- Other App -->
                <button onclick="hd_player()" class="glass-panel p-3 rounded-xl hover:border-rose-500/40 hover:bg-gray-800/80 transition flex flex-col items-center justify-center gap-1.5 group active:scale-95">
                    <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl group-hover:scale-110 transition">
                        <i class="bi bi-box-arrow-up-right"></i>

    <!-- Footer -->
    <footer class="glass-panel border-t border-gray-800/80 mt-6 py-4 text-center text-xs text-gray-500">

    <!-- Scripts -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    {% raw %}
    <script>
        var lazyLink = window.location.href.replace('/watch/', '/');
        var player;

        document.addEventListener('DOMContentLoaded', function () {
            player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time',
                    'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['speed'],
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                keyboard: { focused: true, global: true },
                tooltips: { controls: true, seek: true },
                clickToPlay: false // Disables Plyr's conflicting click-to-fullscreen handler
            });

            // Automatic Screen Orientation Lock on Fullscreen
            player.on('enterfullscreen', function () {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function () {});
                }
            });

            player.on('exitfullscreen', function () {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            });

            setupGestures();
        });

        function setupGestures() {
            var plyrContainer = document.querySelector('.plyr');
            if (!plyrContainer) {
                setTimeout(setupGestures, 100);
                return;
            }

            // CRITICAL: Block Plyr's native double-click from exiting/toggling fullscreen!
            plyrContainer.addEventListener('dblclick', function (e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            }, true);

            // Create gesture elements
            var speedBadge = document.createElement('div');
            speedBadge.className = 'speed-badge';
            speedBadge.innerHTML = '<i class="bi bi-lightning-charge-fill mr-1"></i> 2X Speed';

            var leftPill = document.createElement('div');
            leftPill.className = 'seek-pill';
            leftPill.id = 'leftPill';
            leftPill.innerHTML = '<i class="bi bi-arrow-counterclockwise text-pink-400"></i> -10s';

            var rightPill = document.createElement('div');
            rightPill.className = 'seek-pill';
            rightPill.id = 'rightPill';
            rightPill.innerHTML = '+10s <i class="bi bi-arrow-clockwise text-pink-400"></i>';

            var gestureLayer = document.createElement('div');
            gestureLayer.className = 'gesture-surface';

            var leftSide = document.createElement('div');
            leftSide.className = 'gesture-side';

            var rightSide = document.createElement('div');
            rightSide.className = 'gesture-side';

            gestureLayer.appendChild(leftSide);
            gestureLayer.appendChild(rightSide);

            plyrContainer.appendChild(speedBadge);
            plyrContainer.appendChild(leftPill);
            plyrContainer.appendChild(rightPill);
            plyrContainer.appendChild(gestureLayer);

            var holdTimer = null;
            var isHolding2X = false;
            var lastTapTime = 0;
            var tapTimeout = null;

            function start2X() {
                if (!player) return;
                isHolding2X = true;
                player.speed = 2.0;
                speedBadge.classList.add('active');
                if (navigator.vibrate) navigator.vibrate(40);
            }

            function stop2X() {
                if (holdTimer) clearTimeout(holdTimer);
                if (isHolding2X && player) {
                    player.speed = 1.0;
                    speedBadge.classList.remove('active');
                    isHolding2X = false;
                }
            }

            // Press & Hold on layer
            gestureLayer.addEventListener('pointerdown', function (e) {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                holdTimer = setTimeout(start2X, 350);
            });

            window.addEventListener('pointerup', stop2X);
            window.addEventListener('pointercancel', stop2X);

            // Double Tap seek vs Single Tap play/pause
            function handleTap(isRightSide, event) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                var now = Date.now();
                var diff = now - lastTapTime;
                lastTapTime = now;

                if (diff < 320) {
                    // Double Tap Seek Triggered
                    clearTimeout(tapTimeout);
                    if (isRightSide) {
                        player.currentTime = Math.min(player.duration || 999999, player.currentTime + 10);
                        flashIndicator(rightPill);
                    } else {
                        player.currentTime = Math.max(0, player.currentTime - 10);
                        flashIndicator(leftPill);
                    }
                } else {
                    // Single Tap Play/Pause
                    tapTimeout = setTimeout(function () {
                        if (!isHolding2X && player) {
                            player.togglePlay();
                        }
                    }, 320);
                }
            }

            function flashIndicator(pill) {
                pill.classList.add('active');
                setTimeout(function () {
                    pill.classList.remove('active');
                }, 600);
            }

            leftSide.addEventListener('pointerup', function (e) {
                if (isHolding2X) return;
                handleTap(false, e);
            });

            rightSide.addEventListener('pointerup', function (e) {
                if (isHolding2X) return;
                handleTap(true, e);
            });
        }

        // External Player Launchers
        function vlc_player() {
            window.location.href = 'vlc://' + lazyLink;
        }

        function mx_player() {
            window.location.href = 'intent:' + lazyLink + '#Intent;package=com.mxtech.videoplayer.ad;type=video/*;end';
        }

        function playit_player() {
            window.location.href = 'playit://playerv2/video?url=' + encodeURIComponent(lazyLink);
        }

        function s_player() {
            window.location.href = 'intent:' + lazyLink + '#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;type=video/*;end';
        }

        function km_player() {
            window.location.href = 'intent:' + lazyLink + '#Intent;package=com.kmplayer;type=video/*;end';
        }

        function hd_player() {
            window.location.href = 'intent:' + lazyLink + '#Intent;action=android.intent.action.VIEW;type=video/*;end';
        }

        function copyCurrentLink() {
            navigator.clipboard.writeText(lazyLink).then(function () {
                alert('Stream URL Copied!');
            }).catch(function () {
                prompt('Copy Stream URL:', lazyLink);
            });
        }
    </script>
    {% endraw %}
</body>
</html>
